<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduSphere SmartCampus</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="auth"><div class="auth-card"><div class="brand"><span>AI</span><b>EduSphere SmartCampus</b></div><h1 data-i18n="authTitle">Оқу платформасына кіру</h1><p data-i18n="authSub">AI көмекші, сабақтар, бағалар және студенттік кампус.</p><div class="tabs"><button class="tab active" onclick="switchAuth('login')" data-i18n="login">Кіру</button><button class="tab" onclick="switchAuth('register')" data-i18n="register">Тіркелу</button></div><input id="name" class="regOnly" placeholder="Аты-жөні"><input id="email" placeholder="Email" value="student@edusphere.kz"><input id="password" type="password" placeholder="Password" value="student123"><input id="group" class="regOnly" placeholder="Топ" value="IT-23"><button onclick="submitAuth()" class="primary" data-i18n="continue">Жалғастыру</button><p id="authMsg"></p><div class="langs"><button onclick="setLang('kk')">KZ</button><button onclick="setLang('ru')">RU</button><button onclick="setLang('en')">EN</button></div></div></div>
<div id="app" class="app hidden"><header><div class="logo"><span>AI</span><b>EDUSPHERE</b></div><div class="top-actions"><button onclick="setLang('kk')">KZ</button><button onclick="setLang('ru')">RU</button><button onclick="setLang('en')">EN</button><b id="who"></b><button onclick="logout()" class="dark" data-i18n="logout">Шығу</button></div></header><aside><div class="search"><b data-i18n="quickSearch">Жылдам іздеу</b><div><input id="searchInput" placeholder="Курс, баға, кесте"><button onclick="doSearch()">⌕</button></div><small id="searchResult"></small></div><nav id="nav"></nav></aside><main><section id="home" class="page active"></section><section id="courses" class="page"></section><section id="assignments" class="page"></section><section id="grades" class="page"></section><section id="schedule" class="page"></section><section id="events" class="page"></section><section id="chat" class="page"></section><section id="ai" class="page"></section><section id="profile" class="page"></section><section id="sitemap" class="page"></section></main></div><script src="app.js"></script></body></html>
